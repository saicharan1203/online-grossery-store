{% extends "base.html" %}

{% block body_class %}auth-page{% endblock %}

{% block content %}
<div class="login-shell login-shell--modern">
    <!-- Left Side: Original Character Illustration (KEPT AS IS) -->
    <div class="login-illustration">
        <div class="illustration-card">
            <!-- Dark Blue/Black - Top Center -->
            <div class="character char-dark" data-eye-range="6" data-eye-tilt="4">
                <span class="char-eyes">
                    <span class="char-eye"><span class="char-pupil"></span></span>
                    <span class="char-eye"><span class="char-pupil"></span></span>
                </span>
                <span class="char-mouth"></span>
            </div>

            <!-- Purple - Center -->
            <div class="character char-purple" data-eye-range="8" data-eye-tilt="5">
                <span class="char-eyes">
                    <span class="char-eye"><span class="char-pupil"></span></span>
                    <span class="char-eye"><span class="char-pupil"></span></span>
                </span>
                <span class="char-mouth"></span>
            </div>

            <!-- Pink - Right of Purple -->
            <div class="character char-pink" data-eye-range="6" data-eye-tilt="4">
                <span class="char-eyes">
                    <span class="char-eye"><span class="char-pupil"></span></span>
                    <span class="char-eye"><span class="char-pupil"></span></span>
                </span>
                <span class="char-mouth"></span>
            </div>

            <!-- Orange Square - Bottom Left -->
            <div class="character char-orange" data-eye-range="7" data-eye-tilt="4">
                <span class="char-eyes">
                    <span class="char-eye"><span class="char-pupil"></span></span>
                    <span class="char-eye"><span class="char-pupil"></span></span>
                </span>
                <span class="char-mouth"></span>
            </div>

            <!-- Small Orange - Below Orange Square -->
            <div class="char-small-orange"></div>

            <!-- Yellow - Right Side -->
            <div class="character char-yellow" data-eye-range="6" data-eye-tilt="4">
                <span class="char-eyes">
                    <span class="char-eye"><span class="char-pupil"></span></span>
                    <span class="char-eye"><span class="char-pupil"></span></span>
                </span>
                <span class="char-mouth"></span>
            </div>

            <!-- Bottom Snack Cards -->
            <div class="snack-cards">
                <div class="snack-card snack-card-peach"></div>
                <div class="snack-card snack-card-yellow"></div>
                <div class="snack-card snack-card-pink"></div>
            </div>
        </div>
    </div>

    <!-- Right Side: Futuristic Login Panel with Diagonal Design -->
    <div class="login-panel-modern">
        <!-- Diagonal background layers -->
        <div class="diagonal-bg">
            <div class="diagonal-layer diagonal-layer--1"></div>
            <div class="diagonal-layer diagonal-layer--2"></div>
            <div class="diagonal-layer diagonal-layer--3"></div>
        </div>

        <!-- Glowing frame -->
        <div class="panel-frame"></div>

        <!-- Content container -->
        <div class="panel-content">
            <!-- Welcome Text on Left of Form -->
            <div class="welcome-section">
                <h2 class="welcome-title">WELCOME<br>BACK!</h2>
                <p class="welcome-subtitle">Hope, You and your<br>Family have a Great<br>Day</p>
            </div>

            <!-- Login Form -->
            <div class="form-section">
                <h1 class="form-title">Login</h1>

                <form method="POST" class="login-form-modern">
                    <div class="input-group">
                        <label for="login-username">Username</label>
                        <div class="input-wrapper">
                            <input id="login-username" type="text" name="username" required>
                            <span class="input-icon">👤</span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="login-password">Password</label>
                        <div class="input-wrapper">
                            <input id="login-password" type="password" name="password" required>
                            <span class="input-icon">🔒</span>
                        </div>
                    </div>

                    <button type="submit" class="login-button-modern">Login</button>

                    <p class="form-footer">
                        Don't have an account? <a href="{{ url_for('main.register') }}">Sign Up</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const card = document.querySelector('.illustration-card');
        const toggleBtn = document.querySelector('.password-field .toggle-visibility');
        const passwordInput = document.getElementById('login-password');

        if (card) {
            const characters = card.querySelectorAll('.character');
            let rafId;
            let bounds = card.getBoundingClientRect();

            const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

            const updateBounds = () => {
                bounds = card.getBoundingClientRect();
            };

            const moveEyes = (clientX, clientY) => {
                const centerX = bounds.left + bounds.width / 2;
                const centerY = bounds.top + bounds.height / 2;
                const normX = clamp((clientX - centerX) / (bounds.width / 2 || 1), -1, 1);
                const normY = clamp((clientY - centerY) / (bounds.height / 2 || 1), -1, 1);

                characters.forEach(character => {
                    const pupils = character.querySelectorAll('.char-pupil');
                    const rangeX = parseFloat(character.dataset.eyeRange || '6');
                    const rangeY = parseFloat(character.dataset.eyeTilt || '4');

                    pupils.forEach(pupil => {
                        const offsetX = normX * rangeX;
                        const offsetY = normY * rangeY;
                        pupil.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
                    });
                });
            };

            const resetEyes = () => {
                characters.forEach(character => {
                    const pupils = character.querySelectorAll('.char-pupil');
                    pupils.forEach(pupil => {
                        pupil.style.transform = `translate(0, 0)`;
                    });
                });
            };

            const pointerHandler = (event) => {
                if (event.pointerType === 'touch' && event.type === 'pointermove') return;
                cancelAnimationFrame(rafId);
                rafId = requestAnimationFrame(() => moveEyes(event.clientX, event.clientY));
            };

            document.addEventListener('pointermove', pointerHandler);
            document.addEventListener('pointerdown', pointerHandler);
            document.addEventListener('pointerleave', (event) => {
                if (!event.relatedTarget && event.pointerType !== 'touch') {
                    resetEyes();
                }
            });
            window.addEventListener('blur', resetEyes);
            window.addEventListener('resize', updateBounds);
            updateBounds();
        }

        if (passwordInput && toggleBtn) {
            const updateToggleState = () => {
                const isVisible = passwordInput.type === 'text';
                toggleBtn.setAttribute('aria-pressed', String(isVisible));
                toggleBtn.setAttribute('aria-label', isVisible ? 'Hide password' : 'Show password');
                toggleBtn.classList.toggle('is-visible', isVisible);
            };

            toggleBtn.addEventListener('click', () => {
                const nextType = passwordInput.type === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', nextType);
                updateToggleState();
                passwordInput.focus({ preventScroll: true });
                passwordInput.setSelectionRange(passwordInput.value.length, passwordInput.value.length);
            });

            toggleBtn.addEventListener('mousedown', (event) => {
                event.preventDefault();
            });

            updateToggleState();
        }

        // Page Turn Transition - Flip to Sign Up
        const signUpLink = document.querySelector('.form-footer a[href*="register"]');
        const rightPanel = document.querySelector('.login-panel-modern');

        if (signUpLink && rightPanel) {
            signUpLink.addEventListener('click', function (e) {
                e.preventDefault();
                const targetUrl = this.href;

                // Add flip-out animation class
                rightPanel.classList.add('page-flip-out');

                // Navigate after animation completes
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 600);
            });
        }
    });
</script>
{% endblock %}
